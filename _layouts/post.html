---
layout: default
---
<div class="section">
    <div class="content">
        <h1 class="title is-size-3 is-family-secondary is-italic">{{ page.title }}</h1>
        <p class="is-family-monospace post-date">{{ page.date | date: "%b %d, %Y" }}</p>
    </div>
    <hr>
    <div class="content post-body">
        {{ content }}
    </div>
</div>
