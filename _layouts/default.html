<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

    <link rel="stylesheet" href="{{ '/static/css/bulma.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/static/css/pygments-3.css' | relative_url }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap">
    <link rel="stylesheet" href="{{ '/static/css/site.css' | relative_url }}">

    {% seo title=false %}
    {% feed_meta %}
</head>
<body>
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <div class="section container">
        <nav class="navbar container is-fixed-top" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
                <div class="navbar-item">
                    <a href="{{ '/' | relative_url }}" class="is-size-4 has-text-weight-bold is-family-secondary is-italic">{{ site.title }}</a>
                </div>
                <a role="button" class="navbar-burger burger" aria-label="menu" aria-expanded="false"
                   onclick="document.querySelector('.navbar-menu').classList.toggle('is-active');">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
            </div>
            <div class="navbar-menu">
                <div class="navbar-end">
                    <a class="navbar-item {% if page.url contains '/blogs' %}is-active{% endif %}" href="{{ '/blogs/' | relative_url }}">
                        <span class="is-size-6 has-text-weight-bold">Blogs</span>
                    </a>
                    <a class="navbar-item {% if page.url contains '/papershelf' %}is-active{% endif %}" href="{{ '/papershelf/' | relative_url }}">
                        <span class="is-size-6 has-text-weight-bold">Papershelf</span>
                    </a>
                    <a class="navbar-item {% if page.url contains '/bookshelf' %}is-active{% endif %}" href="{{ '/bookshelf/' | relative_url }}">
                        <span class="is-size-6 has-text-weight-bold">Bookshelf</span>
                    </a>
                    <a class="navbar-item {% if page.url contains '/courses' %}is-active{% endif %}" href="{{ '/courses/' | relative_url }}">
                        <span class="is-size-6 has-text-weight-bold">Courses</span>
                    </a>
                    <a class="navbar-item {% if page.url contains '/talks' %}is-active{% endif %}" href="{{ '/talks/' | relative_url }}">
                        <span class="is-size-6 has-text-weight-bold">Talks</span>
                    </a>
                    <div class="navbar-item">
                        <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                            <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                            <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <script>
            (function() {
                function initToggle() {
                    var btn = document.getElementById('dark-mode-toggle');
                    var sun = document.getElementById('sun-icon');
                    var moon = document.getElementById('moon-icon');
                    if (!btn || !sun || !moon) return;
                    function render(theme) {
                        sun.style.display = theme === 'dark' ? 'none' : 'block';
                        moon.style.display = theme === 'dark' ? 'block' : 'none';
                    }
                    render(localStorage.getItem('theme') || 'light');
                    btn.addEventListener('click', function() {
                        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                        document.documentElement.setAttribute('data-theme', next);
                        localStorage.setItem('theme', next);
                        render(next);
                    });
                }
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', initToggle);
                } else {
                    initToggle();
                }
            })();
        </script>

        {% if site.google_analytics %}
        <script>
            (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
            (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
            m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
            })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
            ga('create', '{{ site.google_analytics }}', 'auto');
            ga('send', 'pageview');
        </script>
        {% endif %}

        <div style="margin-top: 4em;">
            {{ content }}
        </div>

        <footer class="section has-text-centered" style="border-top: 1px solid var(--border-light); margin-top: 3em;">
            <div class="content">
                <a href="https://twitter.com/nitinkumarsin10">Twitter</a> ·
                <a href="https://github.com/nitinitleen1">GitHub</a> ·
                <a href="https://www.linkedin.com/in/nitinnks/">LinkedIn</a> ·
                <a href="{{ '/atom.xml' | relative_url }}">RSS</a>
            </div>
        </footer>
    </div>
</body>
</html>
