<!DOCTYPE html>
<html lang="{{ site.locale | default: 'en-US' }}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

    <link rel="stylesheet" href="{{ '/static/css/semantic-3.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/static/css/pygments-3.css' | relative_url }}">

    {% seo title=false %}
    {% feed_meta %}

    <script src="{{ '/static/js/jquery-1.11.3.min.js' | relative_url }}"></script>
</head>
<body>
    <div class="ui secondary basic menu center aligned" style="border-top: 4px solid #0079ff; margin-bottom: 0px;">
        <a class="item{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}"><b>{{ site.title | upcase }}</b></a>
        <a class="item{% if page.url == '/blog/' %} active{% endif %}" href="{{ '/blog/' | relative_url }}">BLOG</a>
        <a class="item" target="_blank" href="https://github.com/nitinitleen1">GITHUB</a>
        <a class="item" target="_blank" href="https://www.linkedin.com/in/nitinnks/">LINKEDIN</a>
    </div>

    {% if site.google_analytics %}
    <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
        ga('create', '{{ site.google_analytics }}', 'auto');
        ga('send', 'pageview');
    </script>
    {% endif %}

    <div class="ui text container" style="margin-top: 10px; padding-bottom: 50px;">
        {{ content }}
    </div>

    <div class="ui center aligned basic segment" style="border-top: 1px solid #eaeaea; margin-top: 40px;">
        <div class="ui horizontal list">
            <a class="item" href="https://twitter.com/nitinkumarsin10">Twitter</a>
            <a class="item" href="https://github.com/nitinitleen1">GitHub</a>
            <a class="item" href="https://www.linkedin.com/in/nitinnks/">LinkedIn</a>
            <a class="item" href="{{ '/atom.xml' | relative_url }}">Feed</a>
        </div>
        <div class="ui grey small text">{{ site.copyright }}</div>
    </div>
</body>
</html>
